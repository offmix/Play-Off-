      html,
        body {
            margin: 0;

            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        #unity-container {
            width: 100%;

    <script>
      function mergeFiles(fileParts) {
            return new Promise((resolve, reject) =&gt; {
                let buffers = [];

                function fetchPart(index) {
                    if (index &gt;= fileParts.length) {
                        let mergedBlob = new Blob(buffers);
                        let mergedFileUrl = URL.createObjectURL(mergedBlob);
                        resolve(mergedFileUrl);
                        return;
                    }
                    fetch(fileParts[index]).then((response) =&gt; response.arrayBuffer()).then((data) =&gt; {
                        buffers.push(data);
                        fetchPart(index + 1);
                    }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i &lt;= end; i++) {
                parts.push(file + &#34;.part&#34; + i);
            }
            return parts;
        }

        window.addEventListener(&#39;resize&#39;, resizeGameContainer);

        function resizeGameContainer() {
            const container = document.getElementById(&#39;gameContainer&#39;);
            if (container) {
                const width = window.innerWidth;
                const height = window.innerHeight;
                container.style.width = `${width}px`;
                container.style.height = `${height}px`;
            }
        }

        window.onload = function () {
            resizeGameContainer();

            Promise.all([
                mergeFiles(getParts(&#34;https://cdn.jsdelivr.net/gh/freebuisness/assets@51462750d29b68ac1e33887c1bf13d9c478d5ead/198/Build/WEB1.2.1.data.unityweb&#34;, 1, 2))
            ]).then(([dataUrl]) =&gt; {
                let json = {
                    companyName: &#34;Slope Plus&#34;,
                    productName: &#34;Slope Plus&#34;,
                    dataUrl: dataUrl,
                    wasmCodeUrl: &#34;https://cdn.jsdelivr.net/gh/freebuisness/assets@51462750d29b68ac1e33887c1bf13d9c478d5ead/198/Build/WEB1.2.1.wasm.code.unityweb&#34;,
                    wasmFrameworkUrl: &#34;https://cdn.jsdelivr.net/gh/freebuisness/assets@51462750d29b68ac1e33887c1bf13d9c478d5ead/198/Build/WEB1.2.1.wasm.framework.unityweb&#34;,
                    TOTAL_MEMORY: 268435456,
                    graphicsAPI: [&#34;WebGL 2.0&#34;, &#34;WebGL 1.0&#34;],
                    webglContextAttributes: {
                        preserveDrawingBuffer: false
                    },
                    splashScreenStyle: &#34;Dark&#34;,
                    backgroundColor: &#34;#000000&#34;
                }
                let blob = new Blob([JSON.stringify(json)], {
                    type: &#39;application/json&#39;
                });
                let blobUrl = URL.createObjectURL(blob);
                UnityLoader.instantiate(&#34;gameContainer&#34;, json, {
                    onProgress: UnityProgress,
                    url: blobUrl
                });
            });
        };
    </script>
