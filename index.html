<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Off!</title>
  <meta name="description" content="ブラウザでプレイできるゲームポータル">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-content">
        <h1 class="logo">
          <svg class="logo-icon" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="8" cy="8" r="5" fill="currentColor"></circle>
            <circle cx="24" cy="8" r="5" fill="currentColor"></circle>
            <circle cx="8" cy="24" r="5" fill="currentColor"></circle>
            <circle cx="24" cy="24" r="5" fill="currentColor"></circle>
          </svg>
          Play Off!
        </h1>
        <p class="tagline">ブラウザでプレイできるゲーム集</p>
      </div>
    </header>

    <section class="controls" aria-label="ゲーム検索とフィルター">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"></path>
        </svg>
        <input type="text" id="searchInput" placeholder="ゲームを検索..." aria-label="ゲーム検索">
      </div>

      <div class="filter-tags" aria-label="ジャンルフィルター">
        <button class="tag active" data-genre="all" type="button">すべて</button>
        <button class="tag" data-genre="action" type="button">アクション</button>
        <button class="tag" data-genre="racing" type="button">レーシング</button>
      </div>
    </section>

    <main class="games-section">
      <div class="games-grid" id="gamesGrid"></div>
      <div class="no-results" id="noResults" style="display:none;">
        <svg viewBox="0 0 64 64" width="48" height="48" aria-hidden="true">
          <circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <path d="M21 32h22M32 21v22" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <p>ゲームが見つかりません</p>
      </div>
    </main>

    <footer class="footer">
      <p>© 2024 Play Off!</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
